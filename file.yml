---
- name: create files and directories
  hosts: all
  roles:
   - filemgt
  tasks:
   - name: create files
     ansible.builtin.file:
      path: "{{ item }}"
      state: touch
     with_items: 
      - "{{ files }}"

   - name: create directories
     ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '777'
     with_items:
      - "{{ directories }}"
